name: Android staging APK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run check && npm test
      - run: npx expo prebuild --platform android --no-install
      # Expo's generated project signs this internal QA release with its debug key.
      - run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: android
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: flo-staging-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
